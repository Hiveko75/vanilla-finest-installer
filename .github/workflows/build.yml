# Builds the installer for Windows (.exe), macOS (universal .dmg, Intel and Apple Silicon) and Linux
# (.AppImage) on every push to main. The files are kept 14 days as build artifacts and get a build
# provenance attestation (check one with: gh attestation verify <file> -R Hiveko75/vanilla-finest-installer).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            artifact: windows
            args: ''
            files: src-tauri/target/release/*.exe
          - platform: macos-latest
            artifact: macos
            args: '--target universal-apple-darwin'
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            artifact: linux
            args: ''
            files: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build
        run: pnpm tauri build --ci ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-finest-installer-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.files }}
