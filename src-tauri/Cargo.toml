[package]
name = "vanilla-finest-installer"
version = "1.0.0"
description = "Installs the Vanilla Finest modpacks into the official Minecraft Launcher (based on Fabulously Optimized's installer)"
authors = ["Skye", "Hiveko"]
license = "MIT"
repository = "https://github.com/Hiveko75/vanilla-finest-installer"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.3.0", features = [ "window-request-user-attention", "shell-open", "dialog-confirm", "window-close"] }
zip = { version = "2.2.0", default-features = false, features = ["aes-crypto", "deflate", "deflate64", "lzma", "bzip2", "zstd", "time"] }
tokio = { version = "1", features = [ "fs" ] }
sha2 = "0.10.8"
hex = "0.4.3"
time = { version = "0.3.36", features = [ "formatting" ] }
anyhow = "1.0.71"
reqwest = "0.11.24"
sysinfo = { version = "0.30", default-features = false }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
